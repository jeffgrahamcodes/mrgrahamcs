<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mr. Graham's CS Class | Digital Pioneers Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF2F6; --grid:#D8E0EA; --ink:#15233D; --muted:#4C5A72;
  --ball:#D4E640; --ball-ink:#2B3300; --wall:#B8432F; --card:#FFFFFF; --line:#C9D3E0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121A2A; --grid:#1D2840; --ink:#E7ECF4; --muted:#A3B0C6;
    --wall:#E07A62; --card:#18223A; --line:#2C3A57;
  }
}
:root[data-theme="dark"]{
  --paper:#121A2A; --grid:#1D2840; --ink:#E7ECF4; --muted:#A3B0C6;
  --wall:#E07A62; --card:#18223A; --line:#2C3A57;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Atkinson Hyperlegible","Segoe UI",Arial,sans-serif;
  font-size:1.0625rem; line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
}
h1,h2,h3{font-family:"Bricolage Grotesque","Arial Narrow",Arial,sans-serif;line-height:1.1;margin:0}
a{color:inherit;text-underline-offset:3px}
img{max-width:100%;height:auto;display:block}
:focus-visible{outline:3px solid var(--wall);outline-offset:3px}
.wrap{max-width:52rem;margin:0 auto;padding:1.25rem 1.25rem 4rem}

/* site header + nav */
.site{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding-bottom:1rem}
.brand{font-weight:700;text-decoration:none}
.brand span{display:block;font-weight:400;color:var(--muted);font-size:.95rem}
nav{position:sticky;top:0;z-index:5;background:var(--paper);border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);margin:0 -1.25rem 1.75rem;padding:0 1.25rem}
nav ul{list-style:none;margin:0;padding:0;display:flex;gap:.25rem;overflow-x:auto;scrollbar-width:none}
@media (min-width:900px){nav ul{flex-wrap:wrap;justify-content:space-between}}
nav ul::-webkit-scrollbar{display:none}
nav a{display:block;white-space:nowrap;padding:.7rem .75rem;text-decoration:none;font-weight:700;border-bottom:4px solid transparent}
nav a[aria-current="page"]{border-bottom-color:var(--ball);background:var(--card)}

.page h1{font-size:clamp(2rem,6vw,3rem);font-weight:800;letter-spacing:-.02em;margin-bottom:.6rem}
.intro{max-width:40rem;margin:0 0 1.5rem;font-size:1.125rem}
section{margin-top:2.5rem}
section h2{font-size:1.6rem;font-weight:700;margin-bottom:.75rem}
section > p{margin:.5rem 0;max-width:40rem}
.panel{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:1.25rem 1.5rem}
.panel p{margin:.4rem 0}

/* newsletter */
.pick{display:flex;align-items:center;gap:.5rem;color:var(--muted);font-size:.95rem;margin-bottom:1rem}
select{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:.35rem .6rem}
.hero{background:var(--card);border:2px solid var(--ink);border-radius:14px;overflow:hidden}
.world{display:block;width:100%;height:auto;border-bottom:2px solid var(--ink);background:var(--paper)}
.hero-text{padding:1.25rem 1.5rem 1.5rem}
.dates{color:var(--muted);margin:0 0 .4rem}
.hero h1{margin:0}
.hero p.lede{margin:.8rem 0 0;max-width:36rem}
.topics{list-style:none;padding:0;margin:0;border-top:2px solid var(--ink)}
.topics li{display:grid;grid-template-columns:11rem 1fr;gap:1rem;padding:1rem 0;border-bottom:1px solid var(--line)}
.topics b{font-family:"Bricolage Grotesque",Arial,sans-serif;font-size:1.15rem}
@media (max-width:560px){.topics li{grid-template-columns:1fr;gap:.2rem}}
.word{background:var(--ball);color:var(--ball-ink);border-radius:14px;padding:1.5rem;border:2px solid var(--ink)}
.word h2{font-size:clamp(2.2rem,8vw,3.4rem);font-weight:800;letter-spacing:-.02em;margin:0 0 .5rem}
.word .def{font-size:1.2rem;margin:0 0 .75rem}
.word p{margin:0}
.tips{display:grid;gap:1rem}
.tip{background:var(--card);border-left:6px solid var(--wall);padding:1rem 1.25rem;border-radius:0 10px 10px 0}
.tip h3{font-size:1.2rem;margin-bottom:.3rem}
.tip p{margin:0}
.upcoming{list-style:none;margin:0;padding:0}
.upcoming li{display:flex;gap:1rem;padding:.6rem 0;border-bottom:1px dashed var(--line)}
.upcoming .when{flex:0 0 8.5rem;font-weight:700}
@media (max-width:480px){.upcoming li{flex-direction:column;gap:0}.upcoming .when{flex:none}}

/* norms */
.norms{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1rem}
.norm{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:1.1rem 1.25rem}
.norm h3{font-size:1.35rem;margin-bottom:.35rem}
.norm p{margin:0}
.period{list-style:none;margin:0;padding:0;counter-reset:step}
.period li{position:relative;padding:.8rem 0 .8rem 3rem;border-bottom:1px solid var(--line)}
.period li::before{counter-increment:step;content:counter(step);position:absolute;left:0;top:.75rem;width:2rem;height:2rem;border-radius:50%;background:var(--ball);color:var(--ball-ink);border:2px solid var(--ink);font-weight:700;display:grid;place-items:center;font-size:.95rem}
.period b{display:block}

/* course map */
.map{list-style:none;margin:0;padding:0;border-left:4px solid var(--ink);margin-left:.5rem}
.map li{position:relative;padding:0 0 1.4rem 1.5rem}
.map li::before{content:"";position:absolute;left:-.8rem;top:.35rem;width:1.1rem;height:1.1rem;border-radius:50%;background:var(--card);border:3px solid var(--ink)}
.map li.now::before{background:var(--ball)}
.map .mo{font-family:"Bricolage Grotesque",Arial,sans-serif;font-weight:700;font-size:1.25rem}
.map .tag{display:inline-block;margin-left:.5rem;font-size:.85rem;font-weight:700;background:var(--ball);color:var(--ball-ink);padding:.05rem .5rem;border-radius:999px;vertical-align:middle}
.map p{margin:.15rem 0 0;max-width:38rem}
.proj{color:var(--wall);font-weight:700}

/* help */
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{position:relative;background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:1rem 1.25rem 1rem 3.75rem;margin-bottom:.8rem}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:1rem;top:1rem;width:2rem;height:2rem;border-radius:50%;background:var(--ink);color:var(--paper);font-weight:700;display:grid;place-items:center}
.steps h3{font-size:1.15rem;margin-bottom:.2rem}
.steps p{margin:0}
details{background:var(--card);border-bottom:1px solid var(--line);padding:.9rem 1.1rem}
details:first-of-type{border-top:2px solid var(--ink)}
summary{cursor:pointer;font-weight:700}
details p{margin:.5rem 0 0}

/* careers */
.stat{display:flex;gap:1.25rem;align-items:center;flex-wrap:wrap;background:var(--ball);color:var(--ball-ink);border:2px solid var(--ink);border-radius:14px;padding:1.25rem 1.5rem}
.stat strong{font-family:"Bricolage Grotesque",Arial,sans-serif;font-size:clamp(2.4rem,9vw,3.6rem);line-height:1;font-weight:800}
.stat p{margin:0;flex:1 1 16rem}
.stat small{display:block;margin-top:.35rem;opacity:.85}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(14.5rem,1fr));gap:1rem;margin-top:1.5rem}
.job{background:var(--card);border:2px solid var(--ink);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.job .pic{background:#fff;border-bottom:2px solid var(--ink);height:11rem;display:flex;align-items:center;justify-content:center;padding:.75rem}
.job .pic img{max-height:100%;max-width:100%;width:auto;object-fit:contain}
.job div.t{padding:.9rem 1.1rem 1.1rem}
.job h3{font-size:1.2rem;margin-bottom:.3rem}
.job p{margin:0}
.job .link{margin-top:.5rem;font-size:.95rem;color:var(--muted)}

/* glossary */
.gloss{margin:0;border-top:2px solid var(--ink)}
.gloss div{display:grid;grid-template-columns:10rem 1fr;gap:1rem;padding:.9rem 0;border-bottom:1px solid var(--line)}
.gloss dt{font-family:"Bricolage Grotesque",Arial,sans-serif;font-weight:700;font-size:1.15rem}
.gloss dd{margin:0}
.gloss .wk{display:block;color:var(--muted);font-size:.9rem}
@media (max-width:520px){.gloss div{grid-template-columns:1fr;gap:.1rem}}

/* about */
.about{display:grid;grid-template-columns:1fr;gap:1.5rem;align-items:start}
.about:has(.photo){grid-template-columns:13rem 1fr}
.photo{aspect-ratio:1;border:2px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--card)}
.photo img{width:100%;height:100%;object-fit:cover}
@media (max-width:600px){.about{grid-template-columns:1fr}.photo{max-width:12rem}}
.path{list-style:none;padding:0;margin:0}
.path li{padding:.6rem 0;border-bottom:1px solid var(--line)}
.path b{display:block}

footer{margin-top:3rem;color:var(--muted);font-size:.95rem;border-top:2px solid var(--ink);padding-top:1rem}
code{font-family:ui-monospace,Menlo,Consolas,monospace;background:rgba(127,127,127,.18);padding:.05rem .3rem;border-radius:4px}
@media (prefers-reduced-motion:no-preference){#karel{transition:transform .9s ease-in-out}}
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <a class="brand" href="#newsletter">Mr. Graham's CS Class<span>9th Grade Computer Science, Digital Pioneers Academy</span></a>
  </header>
  <nav aria-label="Site">
    <ul id="nav"></ul>
  </nav>
  <main id="app"></main>
  <footer>
    Questions anytime: <span class="contact"></span>
  </footer>
</div>

<script>
/* ============================================================
   EDIT HERE
   ============================================================ */
const CONTACT = "jeffery.graham@digitalpioneers.org";
const CURRENT_UNIT_ID = "u2";   // highlights "you are here" on the course map

/* NEWSLETTER ISSUES: copy the newest block, paste it at the TOP, change the text. */

  {

    label: "Sept 14 to 18",
    title: "Loops, bugs, and thinking like a programmer",
    lede: "Scholars are finishing Unit 2, where they program Karel, a robot who lives on a grid and only knows a few commands. Karel can't even turn right. Scholars taught it by turning left three times. Everything this week builds on that idea: break a big job into small steps a computer can follow.",

    topics: [

      ["Control structures", "Picking the right tool. Should Karel repeat something a set number of times, repeat until something changes, or make a decision?"],
      ["Debugging", "Finding and fixing mistakes in code. Every programmer writes bugs. Good ones know how to hunt them down."],

    word: {
      term: "Debugging",
      def: "Finding and fixing errors in code.",
      extra: "The first computer \"bug\" on record was a real moth stuck inside a Harvard computer in 1947. Grace Hopper's team taped it into their logbook."
    },
    home: [
      ["Talk in loops", "\"While there are dishes in the sink, wash one.\" \"While it's raining, keep the umbrella up.\" Ask your scholar to make up one of their own. If they can, they get it."],
      ["Play Be the Computer", "Have your scholar give you step-by-step directions to make a PB&J, and follow them exactly. Forgot to say \"open the jar\"? Don't open it. It gets ridiculous fast, and that's the lesson: an algorithm has to be precise."],
      ["When they're stuck, don't fix it", "Our class norm is Debug First: read the error, find the line, try something different. Your best move is asking, \"What did the error message say?\""],

/* EXTRA GLOSSARY WORDS (besides each week's Word of the Week) */
const EXTRA_WORDS = [
  ["Algorithm", "A step-by-step plan for solving a problem. A recipe is an algorithm."],
  ["Loop", "Code that repeats. A for loop repeats a set number of times; a while loop repeats as long as something stays true."],
  ["Function", "A named set of instructions you can use again and again. Scholars wrote a turn_right function so Karel could turn right with one command."],
  ["Bug", "A mistake in code that makes a program do the wrong thing or stop working."]
];

/* ============================================================ */

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

const PAGES = [
  ["newsletter", "This Week"],
  ["class", "How Class Works"],
  ["map", "Course Map"],
  ["careers", "Careers"],
  ["words", "CS Words"],
  ["about", "About Mr. Graham"]
];

function worldSVG(){
  const cols=8, rows=3, s=60, w=cols*s, h=rows*s;
  let g="";
  for(let x=0;x<=cols;x++) g+=`<line x1="${x*s}" y1="0" x2="${x*s}" y2="${h}" stroke="var(--line)"/>`;
  for(let y=0;y<=rows;y++) g+=`<line x1="0" y1="${y*s}" x2="${w}" y2="${y*s}" stroke="var(--line)"/>`;
  for(let x=0;x<cols;x++) for(let y=0;y<rows;y++) g+=`<circle cx="${x*s+s/2}" cy="${y*s+s/2}" r="2" fill="var(--muted)" opacity=".5"/>`;
  g+=`<rect x="${w-8}" y="${s}" width="8" height="${2*s}" fill="var(--wall)"/>`;
  g+=[3,5,6].map(x=>`<circle cx="${x*s+s/2}" cy="${2*s+s/2}" r="13" fill="var(--ball)" stroke="var(--ink)" stroke-width="2"/>`).join("");
  g+=`<g id="karel" style="transform:translateX(0px)"><polygon points="${s*.22},${2*s+s*.2} ${s*.22},${2*s+s*.8} ${s*.82},${2*s+s*.5}" fill="var(--ink)"/></g>`;
  return `<svg class="world" viewBox="0 0 ${w} ${h}" role="img" aria-label="A Karel grid world with Karel moving toward tennis balls and a wall">${g}</svg>`;
}

function pageNewsletter(){
  const opts = ISSUES.map(i=>`<option value="${i.id}">${esc(i.label)}</option>`).join("");
  return `<div class="page">
    <label class="pick">Week <select id="weekSelect" aria-label="Choose a week">${opts}</select></label>
    <div id="issue"></div>
  </div>`;
}
function renderIssue(issue){
  document.getElementById("issue").innerHTML = `
    <article class="hero">
      ${worldSVG()}
      <div class="hero-text">
        <p class="dates">Week of ${esc(issue.label)}</p>
        <h1>${esc(issue.title)}</h1>
        <p class="lede">${esc(issue.lede)}</p>
        ${issue.note?`<p class="lede">${esc(issue.note)}</p>`:""}
      </div>
    </article>
    <section><h2>This week in CS</h2>
      <ul class="topics">${issue.topics.map(([t,d])=>`<li><b>${esc(t)}</b><span>${esc(d)}</span></li>`).join("")}</ul>
    </section>
    <section class="word">
      <p style="margin:0 0 .25rem;font-weight:700">Word of the week</p>
      <h2>${esc(issue.word.term)}</h2>
      <p class="def">${esc(issue.word.def)}</p>
      <p>${esc(issue.word.extra)}</p>
    </section>
    <section><h2>How you can help at home</h2>
      <p>No coding background needed. Each one takes under ten minutes.</p>
      <div class="tips">${issue.home.map(([t,d])=>`<div class="tip"><h3>${esc(t)}</h3><p>${esc(d)}</p></div>`).join("")}</div>
    </section>
    <section><h2>Coming up</h2>
      <ul class="upcoming">${issue.upcoming.map(([w,d])=>`<li><span class="when">${esc(w)}</span><span>${esc(d)}</span></li>`).join("")}</ul>
    </section>
    <section class="panel">
      <p><b>I call five families every day.</b> If you get a call from me, odds are it's good news. Pick up!</p>
      <p>Mr. Graham</p>
    </section>`;
  const k=document.getElementById("karel");
  if(k && !matchMedia("(prefers-reduced-motion: reduce)").matches){
    requestAnimationFrame(()=>requestAnimationFrame(()=>{k.style.transform="translateX(180px)";}));
  }
}

function pageClass(){
  return `<div class="page">
    <h1>How class works</h1>
    <p class="intro">Your scholar is learning Python, a programming language used by real engineers. Here's what a day in CS looks like and what we expect from everyone in the room, adults included.</p>

    <section><h2>Our four norms</h2>
      <div class="norms">
        <div class="norm"><h3>Bring Your Voice</h3><p>Scholars share ideas, ask questions, and explain their thinking out loud. A wrong answer said out loud helps the whole class more than a right answer kept quiet.</p></div>
        <div class="norm"><h3>Debug First</h3><p>When code breaks, scholars read the error message and try to find the problem before raising a hand. That's what programmers do all day.</p></div>
        <div class="norm"><h3>Try Different Approaches</h3><p>There's almost always more than one way to solve a coding problem. If the first idea doesn't work, try a second one.</p></div>
        <div class="norm"><h3>Stay Focused</h3><p>Laptops are for CodeHS during class. Staying on task is how scholars finish their work in the room instead of at home.</p></div>
      </div>
    </section>

    <section><h2>A typical class period</h2>
      <ol class="period">
        <li><b>Do Now</b>A few quick questions on paper to warm up and connect to what we learned last time.</li>
        <li><b>Mini-lesson</b>I teach the new idea and we work through an example together. Scholars take notes on a paper notecatcher, so the thinking happens before the laptops open.</li>
        <li><b>Coding practice</b>Scholars write and test programs in CodeHS, on their own or with a partner.</li>
        <li><b>Check for understanding</b>A short question at the end so I know who has it and who needs more help tomorrow.</li>
      </ol>
    </section>

  </div>`;
}

function pageMap(){
  return `<div class="page">
    <h1>Course map</h1>
    <p class="intro">Here's the path for the year. Dates move a little when testing, snow days, or assemblies come up, so think of these as seasons, not deadlines. Projects are in red.</p>

    </div>
    <div class="jobs">
      ${JOBS.map(([n,t,d])=>`<article class="job">
        <div class="pic"><img src="${IMGS[n]}" alt="Illustration of a ${esc(t.toLowerCase())} at work" loading="lazy"></div>
        <div class="t"><h3>${esc(t)}</h3><p>${esc(d)}</p></div>
      </article>`).join("")}
    </div>
    <section class="panel">
      <p><b>Talk about it at home.</b> Ask your scholar which of these jobs sounds most interesting and why. There's no wrong answer, and it tells you a lot about what gets them excited.</p>
    </section>
  </div>`;
}

function pageWords(){
  const weekly = ISSUES.map(i=>[i.word.term, i.word.def, "Word of the week, "+i.label]);
  const seen = new Set(weekly.map(w=>w[0].toLowerCase()));
  const all = weekly.concat(EXTRA_WORDS.filter(w=>!seen.has(w[0].toLowerCase())).map(w=>[w[0],w[1],""]))
    .sort((a,b)=>a[0].localeCompare(b[0]));
  return `<div class="page">
    <h1>CS words</h1>
    <p class="intro">When your scholar says "my loop won't stop," this is where to look. Every Word of the Week lands here, so the list grows all year.</p>
    <dl class="gloss">
      ${all.map(([t,d,wk])=>`<div><dt>${esc(t)}</dt><dd>${esc(d)}${wk?`<span class="wk">${esc(wk)}</span>`:""}</dd></div>`).join("")}
    </dl>
  </div>`;
}

function pageAbout(){
  return `<div class="page">
    <h1>About Mr. Graham</h1>
    <div class="about">
      <!-- PHOTO: uncomment the line below and swap in your image when you have one.
      <div class="photo"><img src="mr-graham.jpg" alt="Mr. Graham"></div>
      -->
      <div>
        <p class="intro" style="margin-top:0">I teach 9th grade Computer Science at Digital Pioneers Academy. Before the classroom, I spent years building and running technology for real.</p>
        <ul class="path">
          <li><b>U.S. Air Force, Captain</b>Communications and Information Systems Officer</li>
          <li><b>Web developer</b>Built websites and applications as a full-stack developer</li>
          <li><b>Amazon Web Services</b>Partner Solutions Architect, helping companies build on the cloud</li>
          <li><b>Digital Pioneers Academy</b>Teaching scholars in Southeast DC to build with code</li>
        </ul>
      </div>
    </div>
    <section class="panel">
      <p>I came to teaching because the scholars in this building deserve the same shot at these careers as anyone else in this city. My job is to make sure they leave my class able to build things, not just use them.</p>
      <p>I'd like to hear from you. Reach me at <span class="contact"></span>.</p>
    </section>
  </div>`;
}

const RENDER = {newsletter:pageNewsletter, class:pageClass, map:pageMap, careers:pageCareers, words:pageWords, about:pageAbout};

document.getElementById("nav").innerHTML = PAGES.map(([id,label])=>`<li><a href="#${id}" data-id="${id}">${label}</a></li>`).join("");

function route(){
  const id = (location.hash||"#newsletter").slice(1);
  const key = RENDER[id] ? id : "newsletter";
  document.getElementById("app").innerHTML = RENDER[key]();
  document.querySelectorAll("nav a").forEach(a=>{
    if(a.dataset.id===key){a.setAttribute("aria-current","page");a.scrollIntoView({block:"nearest",inline:"nearest"});}
    else a.removeAttribute("aria-current");
  });
  document.querySelectorAll(".contact").forEach(el=>{
    el.innerHTML = `<a href="mailto:${esc(CONTACT)}">${esc(CONTACT)}</a>`;
  });
  if(key==="newsletter"){
    const sel=document.getElementById("weekSelect");
    sel.addEventListener("change",()=>renderIssue(ISSUES.find(i=>i.id===sel.value)));
    renderIssue(ISSUES[0]);
  }
  const label = PAGES.find(p=>p[0]===key)[1];
  document.title = `${label} | Mr. Graham's CS Class`;
  window.scrollTo(0,0);
}
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
